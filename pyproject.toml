[project]
name = "wsp-studio"
version = "0.1.0"
description = "General-purpose Weight-Space Programming (WSP) harness with Gemini and AWS Bedrock writers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "transformers>=4.45",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
